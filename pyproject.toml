[build-system]
requires = ["setuptools>=42", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "litellm-kamiwaza"
version = "0.1.5"
description = "LiteLLM Router integration for Kamiwaza AI"
readme = "README.md"
requires-python = ">=3.10"
authors = [{name = "Matt Wallace", email = "matt@kamiwaza.ai"}]
license = {text = "MIT"}
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
dependencies = [
    # <1.107.0: litellm 1.107.0 was malicious (2026-10-21); raise only after review.
    "litellm>=1.50.0,<1.107.0",
    "kamiwaza>=0.3.3.0",
]

[project.urls]
"Homepage" = "https://github.com/kamiwaza-ai/litellm-kamiwaza"
"Bug Tracker" = "https://github.com/kamiwaza-ai/litellm-kamiwaza/issues"
